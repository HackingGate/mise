name: release-hg

# The fork's release: Linux musl tarballs for x64 and arm64 of a `v*-hg.*`
# tag, each with its .sha256, plus SHA256SUMS and a build provenance
# attestation.
#
# release.yml is upstream's and cannot run here: it needs upstream's Namespace
# runners and signing and publishing secrets. This file builds the two targets
# the fork's users install, each on a GitHub runner of its own architecture,
# through upstream's scripts/build-tarball.sh without PGO. It lives in a file of its own so a
# rebase onto upstream never conflicts with it.
#
# Cargo.toml keeps upstream's version; the asset names carry the fork tag, as
# v2026.10.12-hg.2's did.

permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Fork tag to release, e.g. v2026.10.18-hg.1"
        required: true
        type: string

concurrency:
  group: release-hg-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Refuse a tag that is not the fork's
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hg\.[0-9]+$ ]] || {
            echo "::error::$TAG is not a fork tag (v<version>-hg.<n>)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - name: Pin the tarballs to one commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build-tarball-${{ matrix.name }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # Native: cross-building it on the amd64 runner lost the runner
          # after 82 minutes (run 40060940195), where x64 took 38.
          - name: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            native: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Install cross
        if: ${{ !matrix.native }}
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2.75.28
        with:
          tool: cross
      # build-tarball.sh runs `cross build` for every Linux target. On the
      # target's own architecture that is a plain cargo build: a `cross` on
      # PATH that execs cargo keeps the script unchanged. Debian's musl-tools
      # ships only `musl-gcc`, which the vendored OpenSSL's cc build needs.
      - name: Prepare a native musl build
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
          mkdir -p "$RUNNER_TEMP/native-bin"
          printf '#!/bin/sh\nexec cargo "$@"\n' > "$RUNNER_TEMP/native-bin/cross"
          chmod +x "$RUNNER_TEMP/native-bin/cross"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      # Upstream builds on xlarge runners. On the standard arm64 runner the
      # build starved it and it was shut down mid-compile (run 40066490070),
      # and again with swap and two compile jobs, 34 minutes after the last
      # crate started (run 40069114416): the fat-LTO link of mise. It gets
      # thin LTO, the disk the runner image's unused toolchains hold, swap
      # and two compile jobs.
      - name: Free disk, add swap, bound the compile jobs and use thin LTO
        if: matrix.native
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          sudo fallocate -l 8G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -h
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_SERIOUS_LTO=thin" >> "$GITHUB_ENV"
      # The native build logs memory and disk every two minutes, so a runner
      # lost again shows what it ran out of.
      - name: build-tarball ${{ matrix.target }}
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          if [[ $NATIVE == true ]]; then
            while sleep 120; do
              echo "resources: $(free -m | awk '/Mem:/{print "mem used " $3 "M of " $2 "M"} /Swap:/{print "swap used " $3 "M"}' | paste -sd,), disk free $(df -h --output=avail / | tail -1)"
            done &
            trap 'kill $!' EXIT
          fi
          scripts/build-tarball.sh ${{ matrix.target }}
      - name: Name the tarball after the fork tag
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p out
          mv dist/mise-v*-"$NAME".tar.gz "out/mise-$TAG-$NAME.tar.gz"
          cd out
          sha256sum "mise-$TAG-$NAME.tar.gz" > "mise-$TAG-$NAME.tar.gz.sha256"
          tar -xzf "mise-$TAG-$NAME.tar.gz" mise/bin/mise
          file mise/bin/mise
          rm -r mise
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.name }}
          path: out/mise-*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish release
    # Needs both targets: a fork release missing one is the gap this file closes.
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: tarball-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -c -- *.sha256
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 2 ] || {
            echo "::error::expected two tarballs"; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      # A published release is never changed: a draft is completed, a
      # published one refused.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
              --title "mise $TAG" \
              --notes "Upstream ${TAG%-hg.*} with the fork's patches. Linux musl builds for x64 and arm64."
          fi
          if [[ $(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft) != true ]]; then
            echo "::error::refusing to change published release $TAG"
            exit 1
          fi
          gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
